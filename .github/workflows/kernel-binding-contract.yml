name: SCQOS kernel binding contract

on:
  pull_request:
    paths:
      - "kernel_integration/**"
      - "tests/test_kernel_binding_contract.py"
      - ".github/workflows/kernel-binding-contract.yml"
  push:
    branches:
      - main
    paths:
      - "kernel_integration/**"
      - "tests/test_kernel_binding_contract.py"

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Python syntax
        run: python3 -m py_compile kernel_integration/scqos_kernel_exec.py

      - name: Binding regression contract
        run: python3 -m unittest tests.test_kernel_binding_contract

      - name: Build BPF and loader against runner BTF
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y clang linux-tools-common linux-tools-generic libbpf-dev libelf-dev zlib1g-dev gcc
          test -r /sys/kernel/btf/vmlinux
          mkdir -p /tmp/scqos-build
          BPFTOOL="$(find /usr/lib/linux-tools -name bpftool | sort | tail -n1)"
          if [ -z "$BPFTOOL" ]; then
            echo "SCQOS_HOLD reason=bpftool_binary_not_found" >&2
            exit 21
          fi
          "$BPFTOOL" version
          "$BPFTOOL" btf dump file /sys/kernel/btf/vmlinux format c > /tmp/scqos-build/vmlinux.h
          clang -O2 -g -target bpf -D__TARGET_ARCH_x86             -I/tmp/scqos-build             -I/usr/include/$(uname -m)-linux-gnu             -c kernel_integration/scqos_exec_gate.bpf.c             -o /tmp/scqos-build/scqos_exec_gate.bpf.o
          gcc -O2 kernel_integration/scqos_exec_gate_loader.c             -o /tmp/scqos-build/scqos_exec_gate_loader             -lbpf -lelf -lz
